<style>
:root{--bg:#fafafa;--card:#fff;--tx:#0e1d47;--mu:#586287;--ln:#dde3f0;--pri:#0b3d91;--onpri:#fff;--ac:#f3bb14;--cream:#fff1c9;--hd:#0b3d91;--ok:#0f7a4a;--okbg:#dff5e8;--bad:#a3341f;--badbg:#fde4de;--warn:#7a5a00;--map:#e9eefa;--zone:#c9d6f3;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0c1328;--card:#151e3a;--tx:#eaf0ff;--mu:#9ba8cf;--ln:#2a3560;--pri:#7ea4ff;--onpri:#0c1328;--cream:#3a3315;--ok:#6fe0a5;--okbg:#12392a;--bad:#ff9d8a;--badbg:#44201a;--warn:#ffd45a;--map:#111a35;--zone:#22305e}}
:root[data-theme="dark"]{--bg:#0c1328;--card:#151e3a;--tx:#eaf0ff;--mu:#9ba8cf;--ln:#2a3560;--pri:#7ea4ff;--onpri:#0c1328;--cream:#3a3315;--ok:#6fe0a5;--okbg:#12392a;--bad:#ff9d8a;--badbg:#44201a;--warn:#ffd45a;--map:#111a35;--zone:#22305e}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:400 16px/1.45 "DM Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--hd);z-index:10}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--hd);color:#fff;padding:14px 16px 18px;overflow:hidden}
header::after{content:"";position:absolute;right:-30px;top:-10px;bottom:-10px;width:90px;background:var(--ac);transform:skewX(-22deg);opacity:.95}
header::before{content:"";position:absolute;right:50px;top:-10px;bottom:-10px;width:26px;background:#fff;transform:skewX(-22deg);opacity:.18}
header h1{margin:0;position:relative}
.brand{display:block;width:min(230px,70%);height:auto}
.city{position:relative;margin:14px 0 2px;font-size:.8125rem;font-weight:700;letter-spacing:.14em;text-transform:uppercase;opacity:.9}
header p{margin:2px 0 0;font-size:.85rem;opacity:.85;position:relative;max-width:70%}
main{max-width:920px;margin:0 auto;padding:16px 16px 110px}
h2{font-size:1.5rem;font-weight:700;margin:4px 0 4px;letter-spacing:-.02em}
.lead{color:var(--mu);margin:0 0 14px}
.muted{color:var(--mu);font-size:.8125rem;font-weight:500;margin:0}
.panel{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:14px;display:grid;gap:12px}
.fld{display:grid;gap:4px;font-weight:500;font-size:.9rem}
.fld select{padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);width:100%}
input[type=range]{width:100%;accent-color:var(--pri)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1.5px solid var(--ln);background:var(--bg);border-radius:99px;padding:7px 14px;font-weight:500;font-size:.9rem}
.chip[aria-pressed=true]{background:var(--pri);color:var(--onpri);border-color:var(--pri)}
.two{display:grid;gap:12px;grid-template-columns:1fr 1fr}
@media(max-width:520px){.two{grid-template-columns:1fr}}
.grid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(270px,1fr))}
.card{background:var(--card);border:1px solid var(--ln);border-radius:14px;padding:14px;display:grid;gap:8px;align-content:start}
.card.off{opacity:.7}
.top{display:flex;justify-content:space-between;gap:8px;align-items:start}
.card h3{margin:0;font-size:1.125rem;font-weight:700;line-height:1.25}
.heart{border:0;background:none;font-size:1.5rem;line-height:1;padding:0 2px;color:var(--pri)}
.price{font-size:1.5rem;font-weight:800;letter-spacing:-.02em}
.price small{font-size:.8rem;font-weight:500;color:var(--mu)}
.badges{display:flex;flex-wrap:wrap;gap:6px}
.b{font-size:.78rem;font-weight:700;padding:3px 9px;border-radius:99px;background:var(--bg);color:var(--mu)}
.b.ok{background:var(--okbg);color:var(--ok)}.b.bad{background:var(--badbg);color:var(--bad)}.b.warn{background:var(--cream);color:var(--warn)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.btn{background:var(--pri);color:var(--onpri);border:0;border-radius:10px;padding:10px 16px;font-weight:700}
.btn.sec{background:var(--bg);color:var(--tx);border:1.5px solid var(--ln)}
.btn.ac{background:var(--ac);color:#0e1d47}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.chk{display:flex;gap:6px;align-items:center;font-size:.88rem;font-weight:500}
.chk input{width:18px;height:18px;accent-color:var(--pri)}
.empty{background:var(--cream);border-radius:14px;padding:18px;display:grid;gap:10px}
.empty h3{margin:0}
nav{position:fixed;left:0;right:0;bottom:0;z-index:9;background:var(--card);border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;border:0;background:none;padding:9px 2px 8px;font-size:.74rem;font-weight:500;color:var(--mu);display:grid;gap:1px;justify-items:center}
nav button span{font-size:1.25rem;line-height:1.2}
nav button[aria-current=page]{color:var(--pri);font-weight:800;box-shadow:inset 0 3px 0 var(--ac)}
.map{width:100%;height:auto;border-radius:14px;border:1px solid var(--ln);background:var(--map);display:block}
.map .pin{cursor:pointer}
.map .pin rect{fill:var(--pri)}.map .pin.off rect{fill:#8790ad}
.map .pin text{fill:var(--onpri);font:700 11px "DM Sans",sans-serif;text-anchor:middle}
.map .zl{fill:var(--mu);font:500 11px "DM Sans",sans-serif;text-anchor:middle}
.tblw{overflow-x:auto;border:1px solid var(--ln);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;min-width:480px}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--ln);font-size:.92rem;vertical-align:top}
th{font-weight:700;color:var(--mu);width:28%}
td.best{background:var(--okbg);color:var(--ok);font-weight:700}
dialog{border:0;border-radius:18px;padding:0;max-width:520px;width:calc(100% - 24px);background:var(--card);color:var(--tx);max-height:88vh}
dialog::backdrop{background:rgba(5,10,30,.55)}
.dl{padding:18px;display:grid;gap:12px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:0}
.kv dt{color:var(--mu)}.kv dd{margin:0;font-weight:500}
.note{background:var(--cream);border-radius:10px;padding:10px 12px;font-size:.9rem}
#toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0e1d47;color:#fff;padding:10px 16px;border-radius:99px;font-weight:500;z-index:20;opacity:0;pointer-events:none;transition:opacity .2s;max-width:92%;text-align:center}
#toast.on{opacity:1}
footer{color:var(--mu);font-size:.8rem;text-align:center;margin-top:20px}
@media(prefers-reduced-motion:reduce){#toast{transition:none}}
.ic{vertical-align:-3px;flex:none}
.btn{display:inline-flex;gap:6px;align-items:center;justify-content:center}
.ln{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ph{display:block;width:calc(100% + 28px);margin:-14px -14px 4px;aspect-ratio:4/3;object-fit:cover;border-radius:14px 14px 0 0;background:var(--ln)}
.off .ph{filter:grayscale(.7)}
.gal{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;display:block}
.thumbs{display:flex;gap:8px}.thumbs img{width:64px;height:48px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid var(--ln)}
.in{padding:10px;border-radius:10px;border:1px solid var(--ln);background:var(--bg);width:100%}
.auth{max-width:440px;margin:0 auto}
.err{background:var(--badbg);color:var(--bad);padding:10px 12px;border-radius:10px;margin:0;font-weight:500}
.lnk{background:none;border:0;color:var(--pri);font-weight:700;padding:0;text-decoration:underline}
.who{display:flex;gap:16px;align-items:center}
.av{border-radius:50%;object-fit:cover;background:var(--pri);color:var(--onpri);display:grid;place-items:center;font-weight:800;flex:none}
.nm{font-size:1.15rem}.sm{padding:7px 12px;font-size:.88rem}
.panel h3{margin:0}
.sw{width:36px;height:36px;border-radius:50%;border:3px solid var(--card);background:var(--c);box-shadow:0 0 0 2px var(--ln)}
.sw[aria-pressed=true]{box-shadow:0 0 0 3px var(--tx)}
nav button{font-size:.68rem}nav button span{line-height:1;display:flex;height:24px;align-items:center}
</style>
</head>

function render(){$("#app").innerHTML=V[S.view]()+'<footer>Données fictives de démonstration.</footer>';
$("#tabs").innerHTML=TB.map(t=>{const cur=S.view===t[0]||(t[0]==="profile"&&S.view==="signup"),n=t[0]==="fav"?S.fav.length:t[0]==="cmp"?S.cmp.length:0;return `<button data-act="tab" data-v="${t[0]}" ${cur?'aria-current="page"':""}><span>${t[0]==="profile"&&S.user&&S.user.photo?avatar(S.user,24):ic(t[1],22)}</span>${t[2]}${n?" ("+n+")":""}</button>`}).join("")}
function toast(m){const t=$("#toast");t.textContent=m;t.classList.add("on");clearTimeout(toast.h);toast.h=setTimeout(()=>t.classList.remove("on"),2600)}
function detail(id){const l=L.find(x=>x.id===id),f=S.fav.includes(id),miss=[];if(l.ch==null)miss.push("charges");if(!l.eq)miss.push("équipements");
const g=GAL[id];$("#dlg").innerHTML=`<div class="dl"><img class="gal" id="gm" src="${IMG[g[0]]}" alt="${l.t}">${g.length>1?`<div class="thumbs">${g.map((n,i)=>`<img src="${IMG[n]}" alt="Photo ${i+1}" data-act="gal" data-n="${n}">`).join("")}</div>`:""}<div class="top"><h2 style="margin:0">${l.t}</h2><button class="heart" data-act="close" aria-label="Fermer">${ic("x",22)}</button></div>${badges(l)}
<div class="price">${fmt(l.p)} MAD<small> /mois</small></div>${l.was&&l.av?`<p class="note">Prix modifié : ${fmt(l.was)} → ${fmt(l.p)} MAD</p>`:""}
<dl class="kv"><dt>Quartier</dt><dd>${qn(l.q)}</dd><dt>Type</dt><dd>${l.ty}, ${l.s} m²</dd><dt>Charges</dt><dd>${l.ch==null?"Non renseignées":l.ch?fmt(l.ch)+" MAD /mois":"Incluses"}</dd><dt>Équipements</dt><dd>${l.eq||"Non renseignés"}</dd><dt>Distance</dt><dd>${f1(km(l))} km de ${sch().n}</dd><dt>Trajet</dt><dd>≈ ${mn(l)} min en transport</dd></dl>
${miss.length?`<p class="note">Il manque : ${miss.join(", ")}. Demandez-les au propriétaire avant de vous déplacer.</p>`:""}
${l.av?"":'<p class="note"><b>Réservé.</b> Inutile de contacter le propriétaire. Retrouvez des alternatives dans la recherche.</p>'}
<div id="ct"></div><div class="row"><button class="btn" data-act="contact" data-id="${id}" ${l.av?"":"disabled"}>Contacter le propriétaire</button><button class="btn sec" data-act="fav" data-id="${id}">${ic("heart",16,f)} ${f?"Retirer":"Favori"}</button><button class="btn sec" data-act="report" data-id="${id}">Signaler</button></div></div>`;
if(!$("#dlg").open)$("#dlg").showModal()}
document.addEventListener("click",e=>{const b=e.target.closest("[data-act]");if(!b){if(e.target===$("#dlg"))$("#dlg").close();return}
const a=b.dataset.act,id=+b.dataset.id,dl=$("#dlg").open;
if(a==="tab"){S.view=b.dataset.v;S.err="";render();scrollTo(0,0)}
else if(a==="open")detail(id);
else if(a==="close")$("#dlg").close();
else if(a==="fav"){S.fav=S.fav.includes(id)?S.fav.filter(i=>i!==id):[...S.fav,id];sv("le_fav",S.fav);render();if(dl)detail(id)}
else if(a==="cmp"){if(S.cmp.includes(id))S.cmp=S.cmp.filter(i=>i!==id);else if(S.cmp.length>=3){toast("Vous pouvez comparer 3 logements au maximum.")}else S.cmp.push(id);render()}
else if(a==="type"){const t=b.dataset.t;S.types=S.types.includes(t)?S.types.filter(x=>x!==t):[...S.types,t];render()}
else if(a==="only"){S.only=!S.only;render()}
else if(a==="clearq"){S.q=null;render()}
else if(a==="pickq"){S.q=b.dataset.k;S.view="search";render();scrollTo(0,0)}
else if(a==="widen"){S.max=Math.min(4000,S.max+500);render()}
else if(a==="alert"){S.alert=!S.alert;sv("le_alert",S.alert);toast(S.alert?"Alerte activée pour cette recherche.":"Alerte désactivée.");render()}
else if(a==="gal")$("#gm").src=IMG[b.dataset.n];
else if(a==="pick")$("#pf").click();
else if(a==="rmphoto")upd({photo:""});
else if(a==="mode"){S.th.mode=b.dataset.m;sv("le_th",S.th);applyTheme();render()}
else if(a==="acc"){S.th.acc=b.dataset.k;sv("le_th",S.th);applyTheme();render()}
else if(a==="logout"){S.user=null;sv("le_sess","");S.view="search";render();toast("Vous êtes déconnecté.")}
else if(a==="contact"){if(!S.user){$("#dlg").close();S.view="profile";S.err="";render();scrollTo(0,0);toast("Connectez-vous pour contacter le propriétaire.");return}const l=L.find(x=>x.id===id);$("#ct").innerHTML=`<p class="note">Disponibilité confirmée ${age(l).toLowerCase()}.<br>Téléphone : <b>06 12 34 ${40+id} ${10+id}</b></p>`}
else if(a==="report"){S.rep.push(id);sv("le_rep",S.rep);S.fav=S.fav.filter(i=>i!==id);S.cmp=S.cmp.filter(i=>i!==id);sv("le_fav",S.fav);$("#dlg").close();render();toast("Annonce signalée et masquée. Merci pour votre aide.")}});
document.addEventListener("input",e=>{if(e.target.dataset.f==="max"){S.max=+e.target.value;$("#bv").textContent=fmt(S.max)+" MAD"}});
document.addEventListener("change",e=>{const f=e.target.dataset.f;if(!f)return;S[f]=f==="max"?+e.target.value:e.target.value;render()});
document.addEventListener("keydown",e=>{if((e.key==="Enter"||e.key===" ")&&e.target.matches(".pin")){e.preventDefault();detail(+e.target.dataset.id)}});
render();
</script>
</body>
</html>
